name: Apply Safe Promotion migration bootstrap

on:
  push:
    branches: [candidate]
    paths:
      - ".github/workflows/apply-migration-bootstrap.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: correspondence-migration-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate
          fetch-depth: 0
      - name: Apply verified migration patch and self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .migration/patch.b64.* > "$RUNNER_TEMP/migration.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/migration.patch.gz.b64" | gzip -dc > "$RUNNER_TEMP/migration.patch"
          test "$(sha256sum "$RUNNER_TEMP/migration.patch" | awk '{print $1}')" = "2af99c953c9c985de81df8a5f57243988efb7051ffcba549b651bdb90942b5b1" || {
            echo "::error::Migration patch digest mismatch."
            exit 1
          }
          git apply --check "$RUNNER_TEMP/migration.patch"
          git apply "$RUNNER_TEMP/migration.patch"
          rm -rf .migration
          rm -f .github/workflows/apply-migration-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: migrate correspondence to Safe Promotion v5.10.27"
          git push origin HEAD:candidate
          final_sha="$(git rev-parse HEAD)"
          echo "Migration committed at $final_sha"
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/p5-release-gate.yml/dispatches"             -f ref=candidate
          echo "P5 workflow dispatched for candidate."
