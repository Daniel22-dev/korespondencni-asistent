name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [candidate, main]

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Exercise fail-closed P5 evidence regression suite
        run: node --test tests/p5-evidence-gate.test.mjs
      - name: Verify P1 browser instrumentation unit tests
        run: node --test tests/ci-playwright-bootstrap.test.mjs
      - name: Install pinned Playwright Chromium with P1 timing
        env:
          CI_BOOTSTRAP_JOB: p5
          CI_BOOTSTRAP_METRICS_PATH: ${{ runner.temp }}/ci-metrics/p5.json
        run: node scripts/ci-playwright-bootstrap.mjs
      - name: Run P5 R2 application release gate
        run: npm run qa:p5:ci
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 2f6d63d43ca83ffb6ce0efe6e2f2dfe957e21443eb75af2b419c1ffa8e88bcb5
      - name: Preserve and validate P5 evidence before foundation rebuild
        run: node scripts/p5-evidence-gate.mjs capture
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
      - name: Enforce GARP 2.7 foundation admission and legacy regressions
        run: npm run qa:garp27:foundation
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 2f6d63d43ca83ffb6ce0efe6e2f2dfe957e21443eb75af2b419c1ffa8e88bcb5
      - name: Enforce explicit legacy GARP 2.5.1 and N5 regression gate
        run: npm run qa:garp25:static
      - name: Build PREP release identity and verify complete release chain
        run: npm run prepare:pages
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
      - name: Upload current P5 and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            qa-results/current
            dist/release-integrity.json
            dist/studio-manifest.json
            dist/sbom.cdx.json
            dist/build-provenance.json
            dist/security-evidence-manifest.json
      - name: Upload P1 Chromium timing evidence (independent)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5-ci-chromium-timing-${{ github.sha }}
          path: ${{ runner.temp }}/ci-metrics/p5.json

  # Compatibility context retained because the existing protected-main ruleset
  # already requires "build-test". It can be removed only after the ruleset is
  # deliberately migrated; p5-release-gate remains the authoritative gate.
  build-test:
    needs: p5-release-gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "build-test compatibility context PASS after authoritative p5-release-gate"