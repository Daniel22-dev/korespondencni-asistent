name: Blocking axe-core audit

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify exact axe-core version
        run: node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
      - name: Verify P1 browser instrumentation unit tests
        run: node --test tests/ci-playwright-bootstrap.test.mjs
      - name: Install pinned Playwright Chromium with P1 timing
        env:
          CI_BOOTSTRAP_JOB: axe
          CI_BOOTSTRAP_METRICS_PATH: ${{ runner.temp }}/ci-metrics/axe.json
        run: node scripts/ci-playwright-bootstrap.mjs
      - name: Build application
        run: npm run build
      - name: Run blocking axe audit on executed UI
        run: npm run qa:axe
      - name: Upload axe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-p5-r2-${{ github.sha }}
          path: dist/qa-p5-axe-runtime-report.json
      - name: Upload P1 Chromium timing evidence (independent)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-ci-chromium-timing-${{ github.sha }}
          path: ${{ runner.temp }}/ci-metrics/axe.json
