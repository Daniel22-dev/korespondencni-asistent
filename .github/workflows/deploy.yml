name: GHRAB QA and deploy

on:
  workflow_run:
    workflows: ["P5 R2 pre-production release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release-build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.release-identity.outputs.app_version }}
      artifact_digest: ${{ steps.release-identity.outputs.artifact_digest }}
      manifest_sha256: ${{ steps.release-identity.outputs.manifest_sha256 }}
      sbom_sha256: ${{ steps.release-identity.outputs.sbom_sha256 }}
      evidence_manifest_sha256: ${{ steps.release-identity.outputs.evidence_manifest_sha256 }}
      build_provenance_sha256: ${{ steps.release-identity.outputs.build_provenance_sha256 }}
      assurance_mode: ${{ steps.release-identity.outputs.assurance_mode }}
      release_stage: ${{ steps.release-identity.outputs.release_stage }}
      garp_profile: ${{ steps.release-identity.outputs.garp_profile }}
      gate: ${{ steps.release-identity.outputs.gate }}
      source_sha: ${{ steps.release-source.outputs.source_sha }}
    steps:
      - name: Resolve verified source SHA
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            source_sha="${{ github.event.workflow_run.head_sha }}"
          else
            source_sha="${{ github.sha }}"
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid release source SHA."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-source.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify deploy originates from Safe Promotion
        run: npm run qa:promotion-origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: main
          GITHUB_SHA: ${{ steps.release-source.outputs.source_sha }}

      - name: Verify protected deployment branch
        run: npm run qa:github-governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: main

      - name: Restore current P5 evidence from the triggering run
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ steps.release-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          artifact_name="p5-r2-${SOURCE_SHA}"
          artifact_id="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" | head -n1)"
          if [ -z "$artifact_id" ]; then
            echo "::error::Current P5 evidence artifact $artifact_name was not found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/p5-evidence"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/p5-evidence.zip"
          unzip -q "$RUNNER_TEMP/p5-evidence.zip" -d "$RUNNER_TEMP/p5-evidence"
          rm -rf qa-results
          mkdir -p qa-results/current
          if [ -d "$RUNNER_TEMP/p5-evidence/qa-results/current" ]; then
            cp -a "$RUNNER_TEMP/p5-evidence/qa-results/current/." qa-results/current/
          elif [ -d "$RUNNER_TEMP/p5-evidence/current" ]; then
            cp -a "$RUNNER_TEMP/p5-evidence/current/." qa-results/current/
          else
            find "$RUNNER_TEMP/p5-evidence" -maxdepth 2 -type f \( -name '*.json' -o -name '*.txt' \) -exec cp {} qa-results/current/ \;
          fi
          test -n "$(find qa-results/current -type f -print -quit)" || { echo "::error::qa-results/current missing in P5 evidence."; exit 1; }

      - name: Rebuild verified commit
        run: npm run build
        env:
          GHRAB_SOURCE_COMMIT: ${{ steps.release-source.outputs.source_sha }}

      - name: Build school profile needed by cumulative GARP controls
        run: npm run qa:school-profile

      - name: Verify platform conformance of rebuilt artifact
        run: npm run qa:platform

      - name: Re-enforce cumulative GARP 2.5.1 and N5 controls on release source
        run: npm run qa:garp25:static

      - name: Verify AI Studio dispatch credential
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deploy is blocked because AI Studio could not be notified safely."
            exit 1
          fi

      - name: Prepare canonical Pages artifact and exact release identity
        run: npm run prepare:pages
        env:
          GHRAB_SOURCE_COMMIT: ${{ steps.release-source.outputs.source_sha }}

      - name: Export verified release identity
        id: release-identity
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const integrity = JSON.parse(fs.readFileSync('dist/release-integrity.json', 'utf8'));
          const required = {
            app_version: integrity.version,
            artifact_digest: integrity.artifactDigest,
            manifest_sha256: integrity.manifestSha256,
            sbom_sha256: integrity.sbomSha256,
            evidence_manifest_sha256: integrity.evidenceManifestSha256,
            build_provenance_sha256: integrity.buildProvenanceSha256,
            assurance_mode: integrity.assuranceMode,
            release_stage: integrity.releaseStage,
            garp_profile: integrity.garpProfile,
            gate: integrity.gate,
          };
          if (integrity.releaseStage !== 'LIVE-PUBLIC-PAGES') {
            console.error(`::error::Release record is not a live Pages release (releaseStage=${integrity.releaseStage}). Deploy is blocked.`);
            process.exit(1);
          }
          const missing = Object.entries(required).filter(([, value]) => !value).map(([key]) => key);
          if (missing.length) {
            console.error(`::error::Release identity is incomplete: ${missing.join(', ')}`);
            process.exit(1);
          }
          for (const [key, value] of Object.entries(required)) {
            if (/[\r\n]/.test(String(value))) {
              console.error('::error::Release identity value is not single-line.');
              process.exit(1);
            }
            process.stdout.write(`${key}=${value}\n`);
          }
          NODE

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: release-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before Pages retry 2
        if: steps.deployment_1.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before Pages retry 3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Enforce successful Pages deployment
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' && steps.deployment_3.outcome != 'success'
        shell: bash
        run: |
          echo "::error::GitHub Pages deployment failed after 3 bounded attempts."
          exit 1

  notify-ai-studio:
    needs: [release-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-build.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify the live release before notifying AI Studio
        env:
          GHRAB_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          GHRAB_LIVE_APP_ID: correspondence
          GHRAB_LIVE_VERSION: ${{ needs.release-build.outputs.app_version }}
          GHRAB_LIVE_SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          GHRAB_LIVE_ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          GHRAB_LIVE_MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          GHRAB_LIVE_OUT: ${{ runner.temp }}/live-release.json
        run: npm run verify:live-release

      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          APP_VERSION: ${{ needs.release-build.outputs.app_version }}
          ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          SBOM_SHA256: ${{ needs.release-build.outputs.sbom_sha256 }}
          EVIDENCE_MANIFEST_SHA256: ${{ needs.release-build.outputs.evidence_manifest_sha256 }}
          BUILD_PROVENANCE_SHA256: ${{ needs.release-build.outputs.build_provenance_sha256 }}
          ASSURANCE_MODE: ${{ needs.release-build.outputs.assurance_mode }}
          RELEASE_STAGE: ${{ needs.release-build.outputs.release_stage }}
          GARP_PROFILE: ${{ needs.release-build.outputs.garp_profile }}
          RELEASE_GATE: ${{ needs.release-build.outputs.gate }}
          LIVE_RELEASE_FILE: ${{ runner.temp }}/live-release.json
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Dispatch is fail-closed."
            exit 1
          fi
          node scripts/build-ai-studio-dispatch.mjs \
            "$LIVE_RELEASE_FILE" \
            "$RUNNER_TEMP/ai-studio-dispatch.json"

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"

          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
