<body><!--==SEM_BUILD_VLOZI_BODY_HTML==--><script type="application/ghrab-protected" data-ghrab-protected>/*==SEM_BUILD_VLOZI_JS==*/</script>
<script type="module" data-ghrab-access-bootstrap>
const APP_ID = 'correspondence';
function showAccessBootstrapFailure(title = 'Spuštění aplikace nelze dokončit', message = 'Ověření přístupu nebo inicializace aplikace selhala. Otevřete aplikaci znovu přes AI Studio.', detail = '') {
  document.documentElement.dataset.ghrabAccess = 'denied';
  document.body.style.visibility = 'visible';
  document.body.innerHTML = '<main class="ghrab-access-gate"><div class="ghrab-access-gate-mark">⬡</div><p class="ghrab-access-gate-eyebrow">AI STUDIO GHRAB</p><h1>' + title + '</h1><p>' + message + '</p><div class="ghrab-access-gate-actions"><a class="ghrab-access-gate-primary" href="/AI-Studio-GHRAB/">Otevřít AI Studio</a></div></main>';
  if (detail) {
    const diagnostic = document.createElement('p');
    diagnostic.className = 'ghrab-access-gate-reason';
    diagnostic.textContent = 'Technická příčina: ' + String(detail).slice(0, 240);
    document.querySelector('.ghrab-access-gate-actions')?.before(diagnostic);
  }
}
try {
  const { protectApp } = await import('/AI-Studio-GHRAB/access/app-guard.js');
  let grantedPermit = null;
  document.addEventListener('ghrab:app-access-granted', event => {
    grantedPermit = event.detail?.permit || null;
  }, { once: true });
  const allowed = await protectApp(APP_ID, { studioUrl: '/AI-Studio-GHRAB/', errorReporter: false });
  if (allowed) {
    window.__GHRAB_STUDIO_ACCESS__ = Object.freeze({ appId: APP_ID, permit: grantedPermit });
    void import('./access/error-reporter-adapter.js').catch((reporterError) => {
      console.warn('KS error reporter bootstrap failed; aplikace pokračuje bez diagnostického panelu.', reporterError);
    });
    const unlock = window.GHRAB_PLATFORM?.unlockProtectedScripts;
    if (typeof unlock !== 'function') throw new Error('GHRAB platform unlock helper is unavailable.');
    const unlocked = unlock();
    if (unlocked < 1 || document.documentElement.dataset.ksAppReady !== 'true') {
      throw new Error('KS application runtime did not reach the ready state after protected-script unlock.');
    }
  } else {
    showAccessBootstrapFailure('Přístup nebyl povolen', 'Tato aplikace nebyla pro tento účet nebo zařízení odemčena. Vraťte se do AI Studia a zkontrolujte oprávnění.');
  }
} catch (error) {
  const errorName = error instanceof Error && error.name ? error.name : 'AccessError';
  console.error('AI Studio access bootstrap failed:', errorName);
  showAccessBootstrapFailure(undefined, undefined, errorName);
}
</script>
